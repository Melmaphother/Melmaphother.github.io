<!DOCTYPE html>
<html lang="en">

<head>
    <script>document.documentElement.dataset.theme = localStorage.getItem('homepage-theme') === 'dark' ? 'dark' : 'light';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="TexPurify - Clean LaTeX text by removing formatting commands like textbf, textit for academic writing">
    <meta name="keywords" content="LaTeX, text cleaning, academic writing, textbf, textit, text formatting">
    <meta name="author" content="Daoyu Wang">
    <meta property="og:title" content="🔬 TexPurify - LaTeX Text Cleaner">
    <meta property="og:description" content="Clean LaTeX text by removing formatting commands for academic writing">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://melmaphother.github.io/texpurify">
    <title>TexPurify - LaTeX Text Cleaner</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="tool-page" data-tool="texpurify">
    <div id="tool-chrome"></div>
    <div class="bg-pattern"></div>

    <div class="container">
        <header class="tool-hero">
            <h1>TexPurify</h1>
            <p>Clean LaTeX formatting for your academic writing.</p>
        </header>

        <main>
            <!-- Input Zone -->
            <div class="input-zone">
                <div class="input-label">
                    <span data-icon="FileText" aria-hidden="true"></span>
                    <span>LaTeX Text Input</span>
                </div>
                <textarea id="input-text"
                    placeholder="Paste your LaTeX text here...&#10;&#10;Example:&#10;This is \textbf{bold text} and this is \textit{italic text}.&#10;We also have \textsc{small caps} and \texttt{monospace}."></textarea>
            </div>

            <!-- Settings Panel -->
            <div class="settings-panel collapsed visible" id="settings-panel">
                <div class="settings-header">
                    <span class="settings-title"><span data-icon="SlidersHorizontal" aria-hidden="true"></span>Settings</span>
                    <button type="button" class="settings-toggle" id="settings-toggle" aria-label="Toggle settings">
                        <span data-icon="ChevronDown" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="settings-grid" id="settings-grid">
                    <!-- Settings will be dynamically generated -->
                </div>
            </div>

            <!-- Preview Section -->
            <div class="preview-section" id="preview-section">
                <div class="preview-grid">
                    <div class="preview-card">
                        <div class="preview-card-header">
                            <span class="preview-card-title">Original</span>
                            <div class="preview-card-actions">
                                <button class="action-btn" id="btn-purify" title="Purify text">
                                    <span data-icon="WandSparkles" aria-hidden="true"></span>
                                    <span>Purify</span>
                                </button>
                            </div>
                        </div>
                        <div class="preview-card-body">
                            <div class="preview-text" id="original-text"></div>
                        </div>
                    </div>
                    <div class="preview-card">
                        <div class="preview-card-header">
                            <span class="preview-card-title">Purified</span>
                            <div class="preview-card-actions">
                                <button class="action-btn action-btn-primary" id="btn-copy" title="Copy to clipboard">
                                    <span data-icon="Copy" aria-hidden="true"></span>
                                    <span>Copy</span>
                                </button>
                            </div>
                        </div>
                        <div class="preview-card-body">
                            <div class="preview-text" id="purified-text"></div>
                            <div class="stats">
                                <div class="stat-item">
                                    <span class="stat-label">Removed Commands</span>
                                    <span class="stat-value" id="removed-count">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Characters Saved</span>
                                    <span class="stat-value" id="saved-count">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>TexPurify made by <a href="https://melmaphother.github.io" target="_blank">Daoyu Wang</a></p>
            <p style="margin-top: 8px;">All processing happens locally in your browser. Your text never leaves your
                device.</p>
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite">
        <span class="toast-icon" aria-hidden="true"></span>
        <span class="toast-message">Text purified successfully!</span>
    </div>

    <script>
        // Formatting commands configuration
        const formattingCommands = {
            'textbf': { label: 'Bold', desc: '\\textbf' },
            'textit': { label: 'Italic', desc: '\\textit' },
            'textsc': { label: 'Small Caps', desc: '\\textsc' },
            'texttt': { label: 'Monospace', desc: '\\texttt' },
            'textsf': { label: 'Sans Serif', desc: '\\textsf' },
            'textmd': { label: 'Medium Weight', desc: '\\textmd' },
            'textup': { label: 'Upright', desc: '\\textup' },
            'textsl': { label: 'Slanted', desc: '\\textsl' },
            'emph': { label: 'Emphasis', desc: '\\emph' },
            'underline': { label: 'Underline', desc: '\\underline' },
            'textnormal': { label: 'Normal Text', desc: '\\textnormal' }
        };

        // DOM Elements
        const inputText = document.getElementById('input-text');
        const btnPurify = document.getElementById('btn-purify');
        const btnCopy = document.getElementById('btn-copy');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsGrid = document.getElementById('settings-grid');
        const previewSection = document.getElementById('preview-section');
        const originalText = document.getElementById('original-text');
        const purifiedText = document.getElementById('purified-text');
        const removedCount = document.getElementById('removed-count');
        const savedCount = document.getElementById('saved-count');
        const toast = document.getElementById('toast');

        // State: selected commands (default: all selected)
        let selectedCommands = new Set(Object.keys(formattingCommands));

        // === Initialize Settings Panel ===
        function initSettingsPanel() {
            // Add "All" checkbox
            const allItem = document.createElement('div');
            allItem.className = 'setting-item';
            allItem.innerHTML = `
                <input type="checkbox" id="setting-all" checked>
                <label for="setting-all"><strong>All</strong></label>
            `;
            settingsGrid.appendChild(allItem);

            const allCheckbox = document.getElementById('setting-all');
            allCheckbox.addEventListener('change', (e) => {
                const isChecked = e.target.checked;
                // Update all individual checkboxes
                Object.keys(formattingCommands).forEach(cmd => {
                    const checkbox = document.getElementById(`setting-${cmd}`);
                    if (checkbox) {
                        checkbox.checked = isChecked;
                        if (isChecked) {
                            selectedCommands.add(cmd);
                        } else {
                            selectedCommands.delete(cmd);
                        }
                    }
                });
            });

            // Add individual command checkboxes
            Object.entries(formattingCommands).forEach(([cmd, config]) => {
                const item = document.createElement('div');
                item.className = 'setting-item';
                item.innerHTML = `
                    <input type="checkbox" id="setting-${cmd}" checked>
                    <label for="setting-${cmd}"><code>${config.desc}</code></label>
                `;
                settingsGrid.appendChild(item);

                const checkbox = document.getElementById(`setting-${cmd}`);
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedCommands.add(cmd);
                    } else {
                        selectedCommands.delete(cmd);
                        // Uncheck "All" if any individual is unchecked
                        allCheckbox.checked = false;
                    }
                });
            });

            // Panel is visible by default with class in HTML; default state is collapsed (class "collapsed" in HTML)
        }

        // Settings panel toggle (collapse/expand)
        document.getElementById('settings-toggle').addEventListener('click', () => {
            settingsPanel.classList.toggle('collapsed');
        });

        // Initialize on load
        initSettingsPanel();

        // === Event Listeners ===

        // Purify button
        btnPurify.addEventListener('click', purifyText);

        // Copy button
        btnCopy.addEventListener('click', copyToClipboard);

        // Auto-purify on input (typing or pasting)
        let autoPurifyTimeout;
        inputText.addEventListener('input', () => {
            const text = inputText.value.trim();
            if (text) {
                originalText.textContent = text;
                if (!previewSection.classList.contains('visible')) {
                    previewSection.classList.add('visible');
                }

                // Auto-purify after a short delay (debounce)
                clearTimeout(autoPurifyTimeout);
                autoPurifyTimeout = setTimeout(() => {
                    if (selectedCommands.size > 0) {
                        purifyText();
                    }
                }, 300);
            } else {
                previewSection.classList.remove('visible');
            }
        });

        // === Functions ===

        /**
         * Find matching closing brace for a command, handling nested braces
         * @param {string} text - The text to search in
         * @param {number} startPos - Starting position after the opening brace
         * @returns {number} - Position of matching closing brace, or -1 if not found
         */
        function findMatchingBrace(text, startPos) {
            let depth = 1;
            let pos = startPos;
            while (pos < text.length && depth > 0) {
                if (text[pos] === '{') depth++;
                else if (text[pos] === '}') depth--;
                pos++;
            }
            return depth === 0 ? pos - 1 : -1;
        }

        /**
         * Purify LaTeX text by removing formatting commands
         * @param {string} text - The input LaTeX text
         * @param {Set} commandsToRemove - Set of command names to remove
         * @returns {Object} - Object containing purified text and statistics
         */
        function purifyLaTeX(text, commandsToRemove) {
            if (!text || text.trim() === '') {
                return { purified: '', removed: 0, saved: 0 };
            }

            if (commandsToRemove.size === 0) {
                return { purified: text, removed: 0, saved: 0 };
            }

            let purified = text;
            let removedCommands = 0;
            const originalLength = text.length;

            // Build regex pattern to find command start (only for selected commands)
            // Escape special regex characters in command names
            const commandList = Array.from(commandsToRemove).map(cmd => cmd.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const commandPattern = new RegExp(
                `\\\\(${commandList.join('|')})\\{`,
                'g'
            );

            // Handle nested commands by iterating until no more matches
            let previousPurified = '';
            let iterations = 0;
            const maxIterations = 20; // Increased to handle deeply nested commands

            while (iterations < maxIterations) {
                previousPurified = purified;

                // Find all matches
                const matches = [];
                commandPattern.lastIndex = 0; // Reset regex
                let match;
                while ((match = commandPattern.exec(purified)) !== null) {
                    matches.push({
                        start: match.index,
                        command: match[1],
                        braceStart: match.index + match[0].length
                    });
                }

                // If no matches found, we're done
                if (matches.length === 0) {
                    break;
                }

                // Process matches in reverse order to maintain correct positions
                for (let i = matches.length - 1; i >= 0; i--) {
                    const m = matches[i];
                    const braceEnd = findMatchingBrace(purified, m.braceStart);

                    if (braceEnd !== -1) {
                        // Normal case: found matching closing brace
                        // Extract content between braces
                        const content = purified.substring(m.braceStart, braceEnd);
                        // Replace the entire command with just the content
                        const before = purified.substring(0, m.start);
                        const after = purified.substring(braceEnd + 1);
                        purified = before + content + after;
                        removedCommands++;
                    } else {
                        // Error case: no matching closing brace found
                        // Remove the command and the opening brace, keep the rest
                        const before = purified.substring(0, m.start);
                        const after = purified.substring(m.braceStart);
                        purified = before + after;
                        removedCommands++;
                    }
                }

                // If no changes were made, we're done
                if (purified === previousPurified) {
                    break;
                }

                iterations++;
            }

            const saved = originalLength - purified.length;

            return {
                purified: purified.trim(),
                removed: removedCommands,
                saved: saved
            };
        }

        function purifyText() {
            const text = inputText.value.trim();

            if (!text) {
                showToast('Please enter some text', '⚠️');
                return;
            }

            if (selectedCommands.size === 0) {
                showToast('Please select at least one command type to remove', '⚠️');
                return;
            }

            const result = purifyLaTeX(text, selectedCommands);

            // Display results
            originalText.textContent = text;
            purifiedText.textContent = result.purified;
            removedCount.textContent = result.removed;
            savedCount.textContent = result.saved;

            // Show preview section
            previewSection.classList.add('visible');

            // Scroll to preview
            previewSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            showToast('Text purified successfully!', '✅');
        }

        async function copyToClipboard() {
            const text = purifiedText.textContent;

            if (!text) {
                showToast('No text to copy', '⚠️');
                return;
            }

            try {
                await navigator.clipboard.writeText(text);
                showToast('Copied to clipboard!', '📋');
            } catch (err) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('Copied to clipboard!', '📋');
                } catch (err) {
                    showToast('Failed to copy', '❌');
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast(message, icon = '✅') {
            const toastEl = document.getElementById('toast');
            document.dispatchEvent(new CustomEvent('tool-toast', { detail: icon }));
            toastEl.querySelector('.toast-message').textContent = message;
            toastEl.classList.add('visible');

            setTimeout(() => {
                toastEl.classList.remove('visible');
            }, 3000);
        }
    </script>
    <script type="module" src="/src/tools/material.jsx"></script>
</body>

</html>
